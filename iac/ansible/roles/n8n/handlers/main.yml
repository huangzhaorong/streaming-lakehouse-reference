- name: restart n8n
  ansible.builtin.systemd:
    name: n8n
    daemon_reload: true
    state: restarted

# 文件变更 → CLI 重导入（幂等）+ 重启生效
- name: reimport n8n
  ansible.builtin.shell: |
    set -e
    /opt/node/bin/n8n import:workflow --separate --input=/opt/n8n/workflows/
    /opt/node/bin/n8n import:credentials --input=/opt/n8n/credentials/
    systemctl restart n8n
  become: true
  become_user: n8n
  environment:
    HOME: "{{ n8n_user_folder }}"
    N8N_USER_FOLDER: "{{ n8n_user_folder }}"
    N8N_ENCRYPTION_KEY: "{{ vault_n8n_encryption_key }}"
